[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.1.0"
description = "Evidence-grounded career analysis with transparent scoring and human review."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Ahmed Raza" }]
keywords = [
    "ai",
    "career",
    "resume",
    "job-search",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-docx>=1.1,<2.0",
    "pypdf>=5.0,<6.0",
    "python-multipart>=0.0.9,<1.0",
    "reportlab>=4.2,<5.0",
    "email-validator>=2.2,<3.0",
    "playwright>=1.50,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "python-dotenv>=1.0,<2.0",
    "openai>=2.41,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "browser: optional Playwright browser tests; run explicitly after installing Chromium",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
