services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careeros}
      POSTGRES_USER: ${POSTGRES_USER:-careeros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - careeros_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      target: backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-careeros}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-careeros}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-demo-secret-change-before-deploying}
      USE_LLM_RESUME_INTELLIGENCE: ${USE_LLM_RESUME_INTELLIGENCE:-false}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-30}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - careeros_documents:/app/generated

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  careeros_postgres:
  careeros_documents:
